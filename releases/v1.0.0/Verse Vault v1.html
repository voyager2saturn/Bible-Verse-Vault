<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verse Vault</title>
<style>
:root{
  --bg:#e9e4d6; --surface:#f7f4ea; --ink:#2b2a28; --sub:#6b6559;
  --line:#c9c0a8; --accent:#7a2e2e; --accent-ink:#f7f4ea;
  --pill:#e2dac2; --pill-on:#7a2e2e;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a16; --surface:#26231d; --ink:#ece6d6; --sub:#a39c88;
    --line:#41392c; --accent:#c98a6a; --accent-ink:#1c1a16;
    --pill:#332c22; --pill-on:#c98a6a;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a16; --surface:#26231d; --ink:#ece6d6; --sub:#a39c88;
  --line:#41392c; --accent:#c98a6a; --accent-ink:#1c1a16;
  --pill:#332c22; --pill-on:#c98a6a;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px;}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:22px;}
h1{font-family:Georgia,'Palatino Linotype',serif;font-weight:700;font-size:1.7rem;margin:0;letter-spacing:.2px;}
.count{color:var(--sub);font-size:.85rem;}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:18px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
label{display:block;font-size:.75rem;color:var(--sub);margin-bottom:4px;}
input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--ink);padding:8px 10px;font-family:inherit;font-size:.92rem;}
textarea{min-height:64px;resize:vertical;font-family:Georgia,serif;}
.field{flex:1;min-width:180px;margin-bottom:10px;}
button{cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:8px 14px;font-size:.85rem;font-weight:600;}
button.ghost{background:transparent;color:var(--accent);}
button.small{padding:4px 9px;font-size:.75rem;}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px;}
.pill{background:var(--pill);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.78rem;cursor:pointer;}
.pill.on{background:var(--pill-on);color:var(--accent-ink);border-color:var(--pill-on);}
.search{margin-bottom:14px;}
.card{border-bottom:1px solid var(--line);padding:14px 0;}
.ref{font-family:Georgia,serif;font-weight:700;font-size:1.05rem;}
.text{font-family:Georgia,serif;color:var(--ink);margin:6px 0;line-height:1.55;}
.notes{color:var(--sub);font-size:.85rem;font-style:italic;margin-top:4px;}
.tags{margin-top:6px;}
.tags span{display:inline-block;background:var(--pill);border-radius:99px;padding:2px 9px;font-size:.72rem;margin:2px 4px 0 0;}
.actions{margin-top:8px;display:flex;gap:8px;}
.empty{color:var(--sub);padding:30px 0;text-align:center;font-size:.9rem;}
footer{margin-top:24px;border-top:1px solid var(--line);padding-top:14px;display:flex;gap:8px;flex-wrap:wrap;}
.hint{color:var(--sub);font-size:.75rem;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Verse Vault</h1>
  <span class="count" id="count"></span>
</header>

<div class="panel">
  <div class="row">
    <div class="field">
      <label>Reference</label>
      <input type="text" id="f-ref" placeholder="Matt 27:54">
    </div>
    <div class="field">
      <label>Tags (comma separated)</label>
      <input type="text" id="f-tags" placeholder="Holy Spirit, Faith">
    </div>
  </div>
  <div class="field">
    <label>Verse text</label>
    <textarea id="f-text" placeholder="Paste the verse text here"></textarea>
  </div>
  <div class="field">
    <label>Notes</label>
    <textarea id="f-notes" placeholder="Your notes"></textarea>
  </div>
  <button onclick="saveEntry()">Save bookmark</button>
  <button class="ghost" id="cancel-edit" style="display:none" onclick="cancelEdit()">Cancel edit</button>
</div>

<input type="text" class="search" id="search" placeholder="Search reference, text or notes...">
<div class="tagbar" id="tagbar"></div>
<div id="list"></div>

<footer>
  <button class="ghost small" onclick="exportJSON()">Export JSON</button>
  <button class="ghost small" onclick="exportCSV()">Export CSV</button>
  <button class="ghost small" onclick="document.getElementById('importFile').click()">Import</button>
  <input type="file" id="importFile" accept=".json,.csv" style="display:none" onchange="importFile(event)">
</footer>
<p class="hint">Data is stored in this browser only. Export regularly to back up or move it to another tool.</p>
</div>

<script>
let data = [];
let activeTags = new Set();
let editingId = null;

try {
  const raw = localStorage.getItem('verseVault');
  if (raw) data = JSON.parse(raw);
} catch(e) { data = []; }

function save(){
  try { localStorage.setItem('verseVault', JSON.stringify(data)); } catch(e) {}
}

function saveEntry(){
  const ref = document.getElementById('f-ref').value.trim();
  const text = document.getElementById('f-text').value.trim();
  const tags = document.getElementById('f-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const notes = document.getElementById('f-notes').value.trim();
  if(!ref){ alert('Reference is required.'); return; }

  if(editingId){
    const item = data.find(d=>d.id===editingId);
    if(item){ item.ref=ref; item.text=text; item.tags=tags; item.notes=notes; }
    cancelEdit();
  } else {
    data.push({id: Date.now()+Math.random(), ref, text, tags, notes, date: new Date().toISOString().slice(0,10)});
  }
  save();
  clearForm();
  render();
}

function clearForm(){
  document.getElementById('f-ref').value='';
  document.getElementById('f-text').value='';
  document.getElementById('f-tags').value='';
  document.getElementById('f-notes').value='';
}

function cancelEdit(){
  editingId = null;
  document.getElementById('cancel-edit').style.display='none';
  clearForm();
}

function editEntry(id){
  const item = data.find(d=>d.id===id);
  if(!item) return;
  editingId = id;
  document.getElementById('f-ref').value = item.ref;
  document.getElementById('f-text').value = item.text;
  document.getElementById('f-tags').value = item.tags.join(', ');
  document.getElementById('f-notes').value = item.notes;
  document.getElementById('cancel-edit').style.display='inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}

function deleteEntry(id){
  if(!confirm('Delete this bookmark?')) return;
  data = data.filter(d=>d.id!==id);
  save();
  render();
}

function allTags(){
  const s = new Set();
  data.forEach(d=>d.tags.forEach(t=>s.add(t)));
  return [...s].sort((a,b)=>a.localeCompare(b));
}

function toggleTag(t){
  if(activeTags.has(t)) activeTags.delete(t); else activeTags.add(t);
  render();
}

function render(){
  const tagbar = document.getElementById('tagbar');
  tagbar.innerHTML = '';
  allTags().forEach(t=>{
    const p = document.createElement('span');
    p.className = 'pill' + (activeTags.has(t)?' on':'');
    p.textContent = t;
    p.onclick = ()=>toggleTag(t);
    tagbar.appendChild(p);
  });

  const q = document.getElementById('search').value.toLowerCase();
  let filtered = data.filter(d=>{
    const matchesTag = activeTags.size===0 || d.tags.some(t=>activeTags.has(t));
    const hay = (d.ref+' '+d.text+' '+d.notes).toLowerCase();
    const matchesQ = !q || hay.includes(q);
    return matchesTag && matchesQ;
  });

  document.getElementById('count').textContent = filtered.length + ' of ' + data.length;

  const list = document.getElementById('list');
  list.innerHTML = '';
  if(filtered.length===0){
    list.innerHTML = '<div class="empty">No bookmarks yet. Add your first one above.</div>';
    return;
  }
  filtered.sort((a,b)=>a.ref.localeCompare(b.ref)).forEach(d=>{
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `
      <div class="ref">${escapeHtml(d.ref)}</div>
      ${d.text?`<div class="text">${escapeHtml(d.text)}</div>`:''}
      ${d.notes?`<div class="notes">${escapeHtml(d.notes)}</div>`:''}
      <div class="tags">${d.tags.map(t=>`<span>${escapeHtml(t)}</span>`).join('')}</div>
      <div class="actions">
        <button class="ghost small" onclick="editEntry(${JSON.stringify(d.id)})">Edit</button>
        <button class="ghost small" onclick="deleteEntry(${JSON.stringify(d.id)})">Delete</button>
      </div>`;
    list.appendChild(c);
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

document.getElementById('search').addEventListener('input', render);

function exportJSON(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  triggerDownload(blob, 'verse-vault.json');
}

function exportCSV(){
  const rows = [['Reference','Text','Tags','Notes','Date']];
  data.forEach(d=>rows.push([d.ref, d.text, d.tags.join('; '), d.notes, d.date]));
  const csv = rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  triggerDownload(blob, 'verse-vault.csv');
}

function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      if(file.name.endsWith('.json')){
        const parsed = JSON.parse(e.target.result);
        parsed.forEach(p=>{
          data.push({id: Date.now()+Math.random(), ref:p.ref||p.Reference||'', text:p.text||p.Text||'',
            tags: p.tags || (p.Tags?p.Tags.split(';').map(t=>t.trim()).filter(Boolean):[]),
            notes:p.notes||p.Notes||'', date:p.date||p.Date||''});
        });
      } else {
        const lines = e.target.result.split(/\r?\n/).filter(Boolean);
        for(let i=1;i<lines.length;i++){
          const cells = parseCsvLine(lines[i]);
          if(cells.length<1 || !cells[0]) continue;
          data.push({id: Date.now()+Math.random()+i, ref:cells[0]||'', text:cells[1]||'',
            tags:(cells[2]||'').split(';').map(t=>t.trim()).filter(Boolean),
            notes:cells[3]||'', date:cells[4]||''});
        }
      }
      save(); render();
      alert('Import complete.');
    }catch(err){ alert('Could not read that file.'); }
    evt.target.value = '';
  };
  reader.readAsText(file);
}

function parseCsvLine(line){
  const out=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQ){
      if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else inQ=false; }
      else cur+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===','){ out.push(cur); cur=''; }
      else cur+=ch;
    }
  }
  out.push(cur);
  return out;
}

render();
</script>
</body>
</html>
